name: Ultron deploy

on:
  push:
    branches: [main]
    paths: [resources/server/**]
  workflow_dispatch:

concurrency: ultron-deploy

env:
  IMAGE: ghcr.io/rw-shekharthapa/ultron:latest # ghcr requires lowercase

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -f resources/server/Dockerfile.h2s -t $IMAGE resources/server
          docker push $IMAGE

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ponytail: server must already be `docker login ghcr.io` with a read:packages token
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            docker pull $IMAGE && docker rm -f ultron
            docker run -d --name ultron --restart unless-stopped --network web \
              -v ultron-data:/home/workspace/.openvscode-server -v ~/project:/home/workspace/project \
              -v ~/token:/token:ro $IMAGE --host 0.0.0.0 --connection-token-file /token
            sleep 10 && docker exec ultron wget -qO- localhost:3000/version"
